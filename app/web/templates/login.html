<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - soc-monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 w-full max-w-md shadow-xl">
    <h1 class="text-2xl font-bold text-cyan-400 mb-2">SOC-Monitor</h1>
    <p class="text-sm text-slate-400 mb-6">Consola de monitoreo de infraestructura y seguridad</p>
    {% if error %}
    <div class="bg-red-950 border border-red-700 text-red-200 px-4 py-2 rounded mb-4 text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm mb-1">Usuario</label>
        <input type="text" name="username" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="block text-sm mb-1">Contraseña</label>
        <input type="password" name="password" required class="w-full bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm" />
      </div>
      <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 rounded">Iniciar Sesión</button>
    </form>
  </div>
</body>
</html>
